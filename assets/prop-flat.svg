<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="flatBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#FFF8F0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B3A5F"/>
      <stop offset="100%" stop-color="#0F233B"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="12" fill="url(#flatBg)"/>

  <!-- Apartment Building / Locked Flat Interior View -->
  <rect x="150" y="50" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="190" y="80" width="120" height="170" rx="4" fill="url(#doorGrad)"/>

  <!-- Brass Door Handle & Security Lock -->
  <circle cx="210" cy="165" r="7" fill="#C9A227"/>
  <rect x="235" y="155" width="30" height="20" rx="3" fill="#C9A227"/>
  <path d="M 250,142 A 8,8 0 0,1 258,155 L 242,155 A 8,8 0 0,1 250,142 Z" fill="none" stroke="#C9A227" stroke-width="3"/>

  <!-- Meter Check Badges -->
  <g transform="translate(40, 90)">
    <rect width="90" height="60" rx="8" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.5"/>
    <text x="45" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748B" text-anchor="middle">WATER &amp; ELEC</text>
    <text x="45" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B3A5F" text-anchor="middle">04,821 kWh</text>
  </g>

  <g transform="translate(370, 90)">
    <rect width="90" height="60" rx="8" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.5"/>
    <text x="45" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748B" text-anchor="middle">SEEPAGE CHECK</text>
    <text x="45" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">✓ DRY &amp; SECURE</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 25)">
    <rect width="210" height="34" rx="17" fill="#1B3A5F"/>
    <text x="105" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Locked Flat Oversight Audit</text>
  </g>
</svg>
