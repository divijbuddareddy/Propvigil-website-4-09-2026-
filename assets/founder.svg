<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F"/>
      <stop offset="50%" stop-color="#0F233B"/>
      <stop offset="100%" stop-color="#1B3A5F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A07F1A"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1B3A5F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Elegant Decorative Gold Grid Overlay -->
  <circle cx="300" cy="180" r="140" fill="url(#avatarGlow)"/>
  <circle cx="300" cy="180" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="300" cy="180" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="570" height="420" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9"/>

  <!-- Founder Avatar Silhouette & Emblem -->
  <g transform="translate(300, 180)">
    <!-- Base Avatar Shield Circle -->
    <circle cx="0" cy="0" r="90" fill="#0F233B" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Silhouette Profile -->
    <!-- Head -->
    <circle cx="0" cy="-20" r="32" fill="#E2E8F0"/>
    <!-- Shoulders / Suit -->
    <path d="M-55,52 C-55,20 -30,12 0,12 C30,12 55,20 55,52 Z" fill="#E2E8F0"/>
    <!-- Tie Accent -->
    <path d="M-6,14 L6,14 L10,52 L0,62 L-10,52 Z" fill="#C9A227"/>
  </g>

  <!-- Gold Star Crest Seal -->
  <g transform="translate(370, 230)">
    <circle cx="0" cy="0" r="24" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M0,-12 L3,-3 L12,-3 L5,3 L8,12 L0,6 L-8,12 L-5,3 L-12,-3 L-3,-3 Z" fill="#1B3A5F"/>
  </g>

  <!-- Text & Badges -->
  <text x="300" y="335" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">V P SRINIVASA</text>
  <text x="300" y="362" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#C9A227" text-anchor="middle" letter-spacing="1.5">FOUNDER &amp; MANAGING PRINCIPAL</text>
  <text x="300" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">Sai Krupa Associates · Real Estate Veteran in Bengaluru</text>
</svg>
